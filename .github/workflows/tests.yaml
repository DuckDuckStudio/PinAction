name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  # 手动触发
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: 发布
        shell: pwsh
        run: dotnet publish src/PinAction/PinAction.csproj --configuration Release

      - name: (Windows) 添加发布目录到 PATH
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |-
          $publishPath = Join-Path -Path (Get-Location) -ChildPath 'src/PinAction/bin/Release/net10.0'
          echo "PATH=$publishPath;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: (Linux) 添加发布目录到 PATH
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: echo "PATH=$(pwd)/src/PinAction/bin/Release/net10.0:$PATH" >> $GITHUB_ENV

      - name: 测试 - help
        shell: pwsh
        run: PinAction --help

      - name: 测试 - version
        shell: pwsh
        run: PinAction --version

      - name: 测试 - license
        shell: pwsh
        run: PinAction --license

      - name: 设置预期哈希
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Windows") {
            # CRLF
            echo "expected=CC49FABDBC9FC0756E6BF9049CF9E494EABCF13BB31F24DF2FE1FC1A2C32FCB4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            # LF
            echo "expected=D810BE383BFA53F8BD7D8C174BB803A539FC6F224C13F349ED7B4CF559D62FED" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: 测试 - 文件
        shell: pwsh
        run: |
          PinAction "tests/file.yaml"
          $actual = (Get-FileHash tests/file.yaml -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:expected) {
            Write-Host "哈希值不匹配!"
            Write-Host "预期: $env:expected"
            Write-Host "实际: $actual"
            Get-Content tests/file.yaml
            exit 1
          } else {
            Write-Host "哈希值匹配: $actual"
          }
          git restore "tests/file.yaml"

      - name: 测试 - 目录
        shell: pwsh
        run: |
          PinAction "tests"
          $actual = (Get-FileHash tests/file.yaml -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:expected) {
            Write-Host "哈希值不匹配!"
            Write-Host "预期: $env:expected"
            Write-Host "实际: $actual"
            Get-Content tests/file.yaml
            exit 1
          } else {
            Write-Host "哈希值匹配: $actual"
          }
          git restore "tests"
