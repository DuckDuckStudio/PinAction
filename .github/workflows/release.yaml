name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号 (不带v)
        required: true
        default: 2.3.3
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.x

      - name: 安装 Inno Setup 7
        uses: DuckDuckStudio/setup-innosetup7@394ba3a7d055015ef3e1ae811677f8fbf7f46b0f # 1.0.0

      - name: 更新版本号
        shell: bash
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
        run: |-
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${GITHUB_EVENT_INPUTS_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#refs/tags/}"
            version="${version#v}"
          fi

          python ".scripts/update_version.py" "$version"

      - name: 发布
        run: dotnet publish src/PinAction/PinAction.csproj --configuration Release

      - name: 打包安装程序
        shell: pwsh
        run: iscc installer.iss

      - name: 上传构建文件
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: Release/PinAction_Setup.exe

      - name: 发布至发行版
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: gh release upload "$env:GITHUB_REF_NAME" "Release/PinAction_Setup.exe" --clobber
